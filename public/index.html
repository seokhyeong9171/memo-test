<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>공용 메모장</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Gaegu:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef2f6; --paper: #ffffff; --ink: #1d2733; --muted: #6b7785;
    --line: #cfe0f1; --accent: #2f5fd0; --mark: #fff3a8; --danger: #c2413a;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12171d; --paper: #1b232c; --ink: #e6ebf1; --muted: #8e9bab;
      --line: #2a3644; --accent: #7ea1ff; --mark: #4a4217; --danger: #ff8a82;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.7 "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  main { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font: 700 34px/1.2 "Gaegu", "Gowun Dodum", cursive; margin: 8px 0 18px; }
  h1 span { background: linear-gradient(transparent 55%, var(--mark) 55%); }

  .paper {
    background: var(--paper); border-radius: 6px; padding: 14px 16px;
    border: 1px solid var(--line);
    background-image: repeating-linear-gradient(transparent 0 27px, var(--line) 27px 28px);
    background-attachment: local;
  }
  input, textarea {
    width: 100%; font: inherit; color: inherit; background: transparent;
    border: 0; border-bottom: 1px solid var(--line); padding: 6px 2px; border-radius: 0;
  }
  textarea { resize: vertical; min-height: 112px; line-height: 28px; border: 0; padding: 0 2px; }
  input:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; gap: 12px; margin-bottom: 10px; }
  .row input { flex: 1; min-width: 0; }
  .bar { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; gap: 12px; }
  .count, .hint { color: var(--muted); font-size: 13px; }
  button {
    font: inherit; border: 0; border-radius: 6px; padding: 9px 16px; cursor: pointer;
    background: var(--accent); color: #fff; min-height: 40px;
  }
  button.ghost { background: transparent; color: var(--muted); padding: 6px 10px; min-height: 34px; font-size: 14px; }
  button.ghost:hover { color: var(--ink); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .err { color: var(--danger); font-size: 14px; min-height: 22px; margin: 6px 0 0; }
  #list { margin-top: 28px; display: grid; gap: 14px; }
  .memo { background: var(--paper); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px 6px; }
  .memo header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .memo .who { font-weight: 700; }
  .memo time { color: var(--muted); font-size: 13px; }
  .memo p { margin: 6px 0 4px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .memo footer { display: flex; justify-content: flex-end; }
  .memo .hint { text-align: right; }
  .dateRow { align-items: center; }
  .dateRow label { flex: none; }
  .empty { text-align: center; color: var(--muted); padding: 32px 0; }

  dialog {
    width: min(92vw, 480px); border: 0; border-radius: 10px; padding: 18px;
    background: var(--paper); color: var(--ink); box-shadow: 0 10px 40px rgba(0,0,0,.25);
  }
  dialog::backdrop { background: rgba(10, 15, 25, .5); }
  dialog h2 { margin: 0 0 10px; font-size: 18px; }
  dialog textarea { border: 1px solid var(--line); padding: 8px; min-height: 120px; line-height: 1.6; margin-bottom: 8px; }
  dialog input { border: 1px solid var(--line); padding: 9px 10px; }
  .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
<main>
  <h1><span>공용 메모장</span></h1>

  <form id="form" class="paper" autocomplete="off">
    <div class="row">
      <input id="name" placeholder="이름" maxlength="20" required aria-label="이름">
      <input id="pw" type="password" placeholder="수정 비밀번호 (4자 이상)" minlength="4" required aria-label="수정 비밀번호">
    </div>
    <div class="row dateRow">
      <label for="created" class="hint">작성일</label>
      <input id="created" type="datetime-local" required>
    </div>
    <textarea id="content" placeholder="메모를 남겨 보세요" maxlength="1000" required aria-label="내용"></textarea>
    <div class="bar">
      <span class="count"><span id="cnt">0</span> / 1000</span>
      <button id="submit" type="submit">메모 남기기</button>
    </div>
    <p class="err" id="formErr" role="alert"></p>
  </form>

  <section id="list" aria-live="polite"></section>
</main>

<dialog id="dlg">
  <h2 id="dlgTitle"></h2>
  <textarea id="dlgContent" maxlength="1000" aria-label="내용"></textarea>
  <input id="dlgPw" type="password" placeholder="수정 비밀번호" aria-label="수정 비밀번호">
  <p class="err" id="dlgErr" role="alert"></p>
  <div class="actions">
    <button type="button" class="ghost" id="dlgCancel">취소</button>
    <button type="button" id="dlgOk">확인</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
let notes = [];
let target = null; // { id, mode: 'edit' | 'delete' }

async function api(path, method = 'GET', body) {
  const res = await fetch(path, {
    method,
    headers: body ? { 'Content-Type': 'application/json' } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '요청에 실패했어요.');
  return data;
}

function fmt(ts) {
  return new Date(ts).toLocaleString('ko-KR', { year: 'numeric', month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit', hour12: false });
}

function render() {
  const list = $('list');
  list.replaceChildren();
  if (!notes.length) {
    const e = document.createElement('div');
    e.className = 'empty';
    e.textContent = '아직 메모가 없어요. 첫 메모를 남겨 보세요.';
    list.append(e);
    return;
  }
  for (const n of notes) {
    const el = document.createElement('article');
    el.className = 'memo';
    const head = document.createElement('header');
    const who = document.createElement('span');
    who.className = 'who'; who.textContent = n.name;
    const t = document.createElement('time');
    t.textContent = '작성 ' + fmt(n.createdAt);
    t.dateTime = new Date(n.createdAt).toISOString();
    head.append(who, t);
    const p = document.createElement('p');
    p.textContent = n.content;
    const foot = document.createElement('footer');
    const edit = document.createElement('button');
    edit.className = 'ghost'; edit.textContent = '수정';
    edit.onclick = () => openDlg(n, 'edit');
    const del = document.createElement('button');
    del.className = 'ghost danger'; del.textContent = '삭제';
    del.onclick = () => openDlg(n, 'delete');
    foot.append(edit, del);
    el.append(head, p);
    if (n.edited || n.updatedAt > n.createdAt) {
      const u = document.createElement('div');
      u.className = 'hint';
      u.textContent = '수정 ' + fmt(n.updatedAt);
      el.append(u);
    }
    el.append(foot);
    list.append(el);
  }
}

async function load() {
  try { notes = await api('/api/notes'); render(); }
  catch (e) { $('list').textContent = e.message; }
}

$('content').addEventListener('input', (e) => { $('cnt').textContent = e.target.value.length; });

$('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  $('formErr').textContent = '';
  $('submit').disabled = true;
  try {
    await api('/api/notes', 'POST', {
      name: $('name').value, password: $('pw').value, content: $('content').value,
      createdAt: new Date($('created').value).getTime(),
    });
    $('pw').value = ''; $('content').value = ''; $('cnt').textContent = '0';
    setNow();
    try { localStorage.setItem('memo-name', $('name').value); } catch {}
    await load();
  } catch (err) { $('formErr').textContent = err.message; }
  $('submit').disabled = false;
});

function openDlg(n, mode) {
  target = { id: n.id, mode };
  $('dlgTitle').textContent = mode === 'edit' ? '메모 수정' : '메모 삭제';
  $('dlgContent').hidden = mode !== 'edit';
  $('dlgContent').value = n.content;
  $('dlgPw').value = ''; $('dlgErr').textContent = '';
  $('dlgOk').textContent = mode === 'edit' ? '수정하기' : '삭제하기';
  $('dlg').showModal();
}

$('dlgCancel').onclick = () => $('dlg').close();

$('dlgOk').onclick = async () => {
  $('dlgErr').textContent = '';
  $('dlgOk').disabled = true;
  try {
    const password = $('dlgPw').value;
    if (target.mode === 'edit') await api(`/api/notes/${target.id}`, 'PUT', { password, content: $('dlgContent').value });
    else await api(`/api/notes/${target.id}`, 'DELETE', { password });
    $('dlg').close();
    await load();
  } catch (err) { $('dlgErr').textContent = err.message; }
  $('dlgOk').disabled = false;
};

function setNow() {
  const d = new Date();
  $('created').value = new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
}
setNow();
try { $('name').value = localStorage.getItem('memo-name') || ''; } catch {}
load();
</script>
</body>
</html>
